name: Docker build
description: >-
  Set up QEMU/Buildx, extract image metadata, and build (optionally push) a
  multi-arch image. Callers must checkout the repo before using this action —
  a local action's own definition can't be loaded until the repo it lives in
  is checked out.

inputs:
  images:
    description: Image name(s) passed to docker/metadata-action
    required: true
  tags:
    description: Extra tag rule(s) passed to docker/metadata-action (e.g. type=raw,value=abc123)
    required: false
    default: ""
  push:
    description: "true to push the built image, false to build only"
    required: false
    default: "false"
  platforms:
    description: Target platforms for the build
    required: false
    default: linux/amd64,linux/arm64
  context:
    description: Build context
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Set up QEMU (for linux/arm64)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.images }}
        tags: ${{ inputs.tags }}

    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
