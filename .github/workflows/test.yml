name: github-actions/test

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  go-test:
    name: Go test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod

      - name: go test
        working-directory: apps/server
        run: go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Compute coverage
        id: coverage
        working-directory: apps/server
        run: |
          percent=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "percent=$percent" >> "$GITHUB_OUTPUT"

  web-test:
    name: Web test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: web test
        run: pnpm --filter @buddy/web test:coverage

      - name: Compute coverage
        id: coverage
        working-directory: apps/web
        run: |
          percent=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct + '%')")
          echo "percent=$percent" >> "$GITHUB_OUTPUT"

  coverage-comment:
    name: Comment coverage
    needs: [go-test, web-test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- coverage-comment -->";
            const goCoverage = "${{ needs.go-test.outputs.coverage }}" || "N/A (job failed)";
            const webCoverage = "${{ needs.web-test.outputs.coverage }}" || "N/A (job failed)";
            const body = [
              marker,
              "### Test coverage",
              "",
              "| Package | Coverage |",
              "| --- | --- |",
              `| \`apps/server\` (Go, statements) | ${goCoverage} |`,
              `| \`apps/web\` (vitest, lines) | ${webCoverage} |`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
