name: github-actions/docker/build-and-push

on:
  push:
    branches: [develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [develop]
    types: [labeled, synchronize, opened]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.HARBOR_URL }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build-and-push:
    if: contains(github.event.pull_request.labels.*.name, 'deploy') || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Split the Harbor project path by intent: deploy-labeled PRs publish
      # to <harbor>/pr, everything else (main/tags) to <harbor>/develop.
      - name: Set docker registry (PR)
        run: echo "DOCKER_REGISTRY=$REGISTRY/pr" >> $GITHUB_ENV
        if: contains(github.event.pull_request.labels.*.name, 'deploy')

      - name: Set docker registry (deployment)
        run: echo "DOCKER_REGISTRY=$REGISTRY/develop" >> $GITHUB_ENV
        if: "!contains(github.event.pull_request.labels.*.name, 'deploy')"

      # PRs still run the full multi-stage build (frontend + Go compile) to
      # catch breakage; only pushed when labeled 'deploy', so most PRs don't
      # need Harbor credentials at all.
      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER_ID }}
          password: ${{ secrets.HARBOR_USER_PASSWORD }}

      - name: Short sha
        id: sha
        run: echo "::set-output name=sha_short::$(echo ${GITHUB_HEAD_SHA:0:7})"
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ steps.sha.outputs.sha_short }}

      - name: Build (and push on main/tags/deploy-labeled PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
