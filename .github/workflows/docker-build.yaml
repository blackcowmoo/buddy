name: github-actions/docker/build

on:
  push:
    # develop is already built by docker-build-and-push.yml on every push;
    # building it again here would just duplicate that (discarded) work.
    branches-ignore:
      - develop

jobs:
  docker-build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build (no push)
        uses: ./.github/actions/docker-build
        with:
          images: ${{ github.repository }}
          push: "false"
